<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testes de menu</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="menu.css">
</head>
<body>

    <button id="menu_status_btn" data-sessao="menu_status" >Formulario status</button>

    <div id="menu">

        <div id="menu_header">

            <button  id="menu_btn_status">Status</button>
            <button  id="menu_btn_pericias">Pericias</button>
            <button  id="menu_btn_combate">Combate</button>
            <button  id="menu_btn_relvas">Relvas</button>
            <button  id="menu_btn_talentos">Talentos</button>
            <button  id="menu_btn_inventario">Inventario</button>
            <button  id="menu_btn_credencial">Credencial</button>
            <button  id="menu_btn_fechar">Fechar</button>

        </div>

        <div id="menu_main">

            <form id="menu_recursos">

                <div class="menu_seg">

                    <h2>STATUS</h2>

                    <h3>Alterar recursos</h3>

                    <select name="Tipo de recurso" data-p="recursos" id="menu_recursos_select">
                        <option value="pv">PV</option>
                        <option value="san">SAN</option>
                        <option value="pe">PE</option>
                    </select>

                    <div class="menu_inputs" id="menu_recursos_inputs">

                        <input 
                            type="number" 
                            data-p="status"
                            data-s="pvC"
                            data-t="fixo" 
                            id="menu_recursos_fixo">
                        <p>+</p>
                        <input 
                            type="number"
                            data-p="status" 
                            data-s="pvC"
                            data-t="mult" 
                            id="menu_recursos_mult">
                        <p>x</p>
                        <p id="menu_recursos_atributo"></p>
                        <p>+</p>
                        <input 
                            type="number"
                            data-p="status"
                            data-s="pvC"    
                            data-t="modP" 
                            id="menu_recursos_mod_p">
                        <p>-</p>
                        <input 
                            type="number" 
                            data-p="status"
                            data-s="pvC"
                            data-t="modN" 
                            id="menu_recursos_mod_n">
                        <p>+</p>
                        <input 
                            type="number" 
                            data-p="status"
                            data-s="pvE"
                            id="menu_recursos_extra">

                    </div>



                </div>


            </form>

            <form id="menu_atributos">

                <div class="menu_seg">

                    <h2>STATUS</h2>

                    <h3>Alterar atributos</h3>

                    <select name="Atributo" id="menu_atributos_select" data-p="atributos">
                        <option value="For">FOR</option>
                        <option value="Agi">AGI</option>
                        <option value="Int">INT</option>
                        <option value="Pre">PRE</option>
                        <option value="Vig">VIG</option>
                    </select>

                    <div class="menu_inputs" id="menu_atributos_inputs">

                        <input 
                            type="number" 
                            data-p="status"
                            data-s="atributos"
                            data-t="For"
                            data-q="fixo" 
                            id="menu_atributos_fixo">
                        <p>+</p>
                        <input 
                            type="number" 
                            data-p="status"
                            data-s="atributos"
                            data-t="For"
                            data-q="modP" 
                            id="menu_atributos_mod_p">
                        <P>-</P>
                        <input 
                            type="number" 
                            data-p="status"
                            data-s="atributos"
                            data-t="For"
                            data-q="modN" 
                            id="menu_atributosx _mod_n">

                    </div>



                </div>


            </form>

            

            <button id="menu_salvar" onclick="menu.salvar()">Salvar</button>

        </div>



    </div>

    <script src="menu.js"></script>
    <script src="../ficha_dados.js"></script>
    <script src="../ficha_calculos copy.js"></script>
    <script src="teste.js"></script>
    
</body>
</html>

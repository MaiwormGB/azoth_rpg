<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testes de menu</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="menu.css">
</head>
<body>

    <button id="menu_status_btn" data-sessao="menu_status" >Formulario status</button>

    <div id="menu">

        <div id="menu_header">

            <button  data-tipo="recursos">Recursos</button>
            <button  data-tipo="atributos">Atributos</button>

        </div>

        <div id="menu_main">

            <form id="menu_recursos">

                <div class="menu_seg">

                    <h2>STATUS</h2>

                    <h3>Alterar recursos</h3>

                    <select name="Tipo de recurso" id="menu_recursos_select">
                        <option value="pv">PV</option>
                        <option value="san">SAN</option>
                        <option value="pe">PE</option>
                    </select>

                    <div class="menu_inputs">

                        <input type="number" id="menu_recursos_fixo">
                        <p>+</p>
                        <input type="number" id="menu_recursos_mult">
                        <p>x</p>
                        <p id="menu_recursos_atributo"></p>
                        <p>+</p>
                        <input type="number" id="menu_recursos_mod_p">
                        <p>-</p>
                        <input type="number" id="menu_recursos_mod_n">

                    </div>



                </div>


            </form>

            <form id="menu_atributos">

                <div class="menu_seg">

                    <h2>STATUS</h2>

                    <h3>Alterar atributos</h3>

                    <select name="Atributo" id="menu_atributos_select">
                        <option value="for">FOR</option>
                        <option value="agi">AGI</option>
                        <option value="int">INT</option>
                        <option value="pre">PRE</option>
                        <option value="vig">VIG</option>
                    </select>

                    <div class="menu_inputs">

                        <input type="number" id="menu_atributos_fixo">
                        <p>+</p>
                        <input type="number" id="menu_recursos_mod_p">
                        <P>-</P>
                        <input type="number" id="menu_recursos_mod_n">

                    </div>



                </div>


            </form>

            <button id="menu_salvar">Salvar</button>

        </div>



    </div>

    <script src="menu.js"></script>
    <script src="../ficha_dados.js"></script>
    
</body>
</html>
